<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Convite Especial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    h1 {
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 40px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    button {
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      white-space: nowrap;
    }

    #btn-sim {
      background: linear-gradient(135deg, #00c853, #69f0ae);
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,200,83,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #btn-sim:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 28px rgba(0,200,83,0.6);
    }

    #btn-nao {
      background: linear-gradient(135deg, #e53935, #ef9a9a);
      color: #fff;
      box-shadow: 0 4px 20px rgba(229,57,53,0.4);
    }

    #btn-nao.fugindo {
      position: fixed;
      z-index: 9999;
      transition: left 0.12s ease, top 0.12s ease;
    }

    /* TELA 2 */
    #success-screen {
      display: none;
      animation: fadeIn 0.6s ease;
    }

    .duck-btn {
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
    }

    .duck-emoji {
      font-size: 8rem;
      display: block;
      margin: 0 auto 16px auto;
      animation: bounce 1.2s infinite;
      line-height: 1;
      transition: transform 0.2s;
    }

    .duck-btn:hover .duck-emoji {
      transform: scale(1.12);
      animation: none;
    }

    .duck-label {
      background: linear-gradient(135deg, #ff6f00, #ffa000);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 10px 28px;
      border-radius: 50px;
      box-shadow: 0 4px 16px rgba(255,111,0,0.4);
      display: inline-block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- TELA 1 -->
    <div id="screen1">
      <h1>No dia 28/03 no mesmo horário?</h1>
      <div class="btn-row">
        <button id="btn-sim" onclick="handleSim()">✅ Sim</button>
        <button id="btn-nao">❌ Não</button>
      </div>
    </div>

    <!-- TELA 2 -->
    <div id="success-screen">
      <a class="duck-btn" href="https://www.youtube.com/watch?v=LxhabQqYJEA" target="_blank" rel="noopener">
        <span class="duck-emoji">🦆</span>
        <span class="duck-label">🦆 Clique no pato!</span>
      </a>
    </div>

  </div>

  <script>
    const btnNao = document.getElementById('btn-nao');
    const btnSim = document.getElementById('btn-sim');
    let escapado = false;

    function moveNao() {
      if (!escapado) {
        escapado = true;
        btnNao.classList.add('fugindo');
      }

      const naoW = btnNao.offsetWidth;
      const naoH = btnNao.offsetHeight;
      const simRect = btnSim.getBoundingClientRect();
      const margin = 20;

      let x, y, tries = 0;
      do {
        x = Math.floor(Math.random() * (window.innerWidth  - naoW));
        y = Math.floor(Math.random() * (window.innerHeight - naoH));
        tries++;
        const overlaps = !(
          x + naoW < simRect.left   - margin ||
          x        > simRect.right  + margin ||
          y + naoH < simRect.top    - margin ||
          y        > simRect.bottom + margin
        );
        if (!overlaps) break;
      } while (tries < 80);

      btnNao.style.left = x + 'px';
      btnNao.style.top  = y + 'px';
    }

    btnNao.addEventListener('mouseover', moveNao);
    btnNao.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNao();
    }, { passive: false });

    function handleSim() {
      document.getElementById('screen1').style.display = 'none';
      document.getElementById('success-screen').style.display = 'block';
      btnNao.style.display = 'none';
    }
  </script>
</body>
</html>
